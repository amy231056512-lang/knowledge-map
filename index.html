<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b19;--fg:#e8e8e2;--mu:#a0a09a;--ln:#3a3a36;--pn:#242421}}
:root[data-theme="dark"]{--bg:#1b1b19;--fg:#e8e8e2;--mu:#a0a09a;--ln:#3a3a36;--pn:#242421}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}

.sep{color:var(--ln);user-select:none}
.ctrl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);cursor:pointer;white-space:nowrap}
.ctrl input{cursor:pointer;accent-color:#3b82c4}
select{font-size:12px;border:1px solid var(--ln);border-radius:4px;padding:2px 5px;background:var(--pn);color:var(--fg);cursor:pointer}
#main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 38px)}
#g{flex:1;overflow:hidden;position:relative}
svg{width:100%;height:100%;display:block}
.node circle{cursor:pointer;stroke:#fff;stroke-width:1.2px;transition:opacity .2s}
.node text{pointer-events:none;font-size:11px;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
.link{stroke-opacity:.7;fill:none;transition:opacity .2s}
.link-label{font-size:10px;fill:var(--mu);pointer-events:none;text-anchor:middle}
.faded{opacity:.12 !important}

#side .conn-list li{padding:5px 0;border-bottom:1px solid var(--ln);font-size:12px;line-height:1.5}
#side .conn-list li:last-child{border:none}
#side .tag{display:inline-block;border-radius:3px;padding:1px 6px;font-size:10px;margin-right:4px;background:var(--ln);color:var(--mu)}
#hint{font-size:12px;color:var(--mu);line-height:1.6}
#hint b{color:var(--fg)}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}

["n04","技能與實作","知識要能應用，光看書不夠，「真正的技能，需要透過實際操作才能學會。」","一之二",1,"x1"],

["n26","時程計畫書","用文字敘述寫成的計畫，「我會先做一個時間表，譬如說今天是9月1號，假設我希望在12月31號完成某件事情。」","五之二",5,"x3"],
["n27","行事曆整合","把工作放進行事曆，「我會先跟同事約好每週要開幾次會，自己要做的事情，也會安排進時間表裡面。」","五之二",5,"x3"],
["n28","重要但不急迫","留時間處理策略性事務，「今天做跟下個禮拜做，影響不一定很大；但如果一直都不做，最後影響就會很大。」","五之二",5,"x3"],

["n33","專注專心","排除干擾，「我在做事情的時候，我非常非常地專心。」","七之一",7,"x4"],

["n35","情緒平和","保持穩定情緒，「情緒穩定，是做好工作很重要的基礎。」","七之二",7,"x4"],

// ── Axis 分組定義
const AXIS = {
  x1: new Set(["n01","n02","n03","n04","n37","n38","n39","n05"]),
  x2: new Set(["n06","n07","n08","n09","n10","n11","n12","n13","n16","n17","n18","n19","n23","n29","n51","n55","n56","n57","n59"]),
  x3: new Set(["n15","n20","n21","n22","n25","n26","n27","n28","n30","n31","n32","n52","n53","n54"]),
  x4: new Set(["n24","n33","n34","n35","n36","n48"]),
  x5: new Set(["n40","n41","n42","n43","n44","n45","n46","n47","n49","n50","n12","n14","n58"])
};

const CH_COL = {
  1:"#4f7cba",2:"#3a9e73",3:"#c8742a",4:"#9b59b6",5:"#c0392b",
  6:"#16a085",7:"#2980b9",8:"#8e6b3e",9:"#7f8c8d",10:"#d35400",11:"#1abc9c"
};
const EDGE_COLOR = "#999";

let nodes, links, activeAxis="all", activeCh="all";
let sim, svg, zoomG, linkSel, nodeSel, labelSel, relSel;
let selectedNode = null;
let showLabels = true, showRel = false;

function buildGraph() {
  // filter nodes
  let nodeSet = new Set(RAW_N.map(d=>d[0]));
  if (activeAxis !== "all") nodeSet = new Set([...nodeSet].filter(id => AXIS[activeAxis].has(id)));
  if (activeCh !== "all") nodeSet = new Set([...nodeSet].filter(id => {
    const n = RAW_N.find(r=>r[0]===id); return n && String(n[4]) === activeCh;
  }));
  // filter edges to both endpoints in nodeSet
  const edgeData = RAW_E.filter(e => nodeSet.has(e[0]) && nodeSet.has(e[2]));

  // build nodes with degree
  const degMap = {};
  edgeData.forEach(e => {
    degMap[e[0]] = (degMap[e[0]]||0)+1;
    degMap[e[2]] = (degMap[e[2]]||0)+1;
  });
  nodes = RAW_N.filter(d=>nodeSet.has(d[0])).map(d => ({
    id:d[0], name:d[1], desc:d[2], src:d[3], ch:d[4], axis:d[5],
    deg: degMap[d[0]]||0
  }));
  const maxDeg = Math.max(1, ...nodes.map(d=>d.deg));
  nodes.forEach(d => { d.r = 6 + 22*Math.pow(d.deg/maxDeg, .8); });

  links = edgeData.map(e => ({
    source:e[0], rel:e[1], target:e[2], src:e[3], note:e[4]
  }));

  render();
}

function render() {
  const svgEl = document.getElementById("svg");
  const W = svgEl.clientWidth || 900, H = svgEl.clientHeight || 600;
  d3.select("#zoomG").selectAll("*").remove();

  linkSel = d3.select("#zoomG").append("g").attr("class","links")
    .selectAll("line").data(links).join("line")
    .attr("class","link")
    .attr("stroke", EDGE_COLOR)
    .attr("stroke-width", 1.4)
    .attr("marker-end","url(#arr)");

  relSel = d3.select("#zoomG").append("g").attr("class","rels")
    .selectAll("text").data(links).join("text")
    .attr("class","link-label")
    .text(d=>d.rel)
    .style("display", showRel ? "block":"none");

  const nodeG = d3.select("#zoomG").append("g").attr("class","nodes")
    .selectAll("g").data(nodes).join("g").attr("class","node")
    .call(d3.drag()
      .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}))
    .on("click",(e,d)=>{e.stopPropagation();selectNode(d)});

  nodeG.append("circle")
    .attr("r",d=>d.r)
    .attr("fill",d=>CH_COL[d.ch]||"#aaa");

  labelSel = nodeG.append("text").text(d=>d.name)
    .attr("y",d=>d.r+12)
    .style("display",showLabels?"block":"none");

  nodeSel = nodeG;

  // defs arrow
  d3.select("#svg").select("defs").remove();
  d3.select("#svg").append("defs").append("marker")
    .attr("id","arr").attr("viewBox","0 -4 8 8").attr("refX",8).attr("refY",0)
    .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
    .append("path").attr("d","M0,-4L8,0L0,4").attr("fill",EDGE_COLOR);

  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(d=>{
      const s = nodes.find(n=>n.id===(d.source.id||d.source));
      const t = nodes.find(n=>n.id===(d.target.id||d.target));
      return 60 + ((s?s.r:10)+(t?t.r:10))*1.1;
    }))
    .force("charge", d3.forceManyBody().strength(-280))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collide", d3.forceCollide().radius(d=>d.r+14))
    .on("tick", ticked);

  // zoom
  const zoom = d3.zoom().scaleExtent([.1,4]).on("zoom",e=>{
    d3.select("#zoomG").attr("transform",e.transform);
  });
  d3.select("#svg").call(zoom);
  d3.select("#svg").on("click",()=>{ selectedNode=null; clearHighlight(); showHint(); });
}

function ticked() {
  linkSel
    .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
    .attr("x2",d=>{
      const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      return d.target.x - dx/dist*(d.target.r+2);
    })
    .attr("y2",d=>{
      const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      return d.target.y - dy/dist*(d.target.r+2);
    });
  relSel
    .attr("x",d=>(d.source.x+d.target.x)/2)
    .attr("y",d=>(d.source.y+d.target.y)/2);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}

function selectNode(d) {
  selectedNode = d;
  // find neighbors
  const neighborIds = new Set();
  links.forEach(l=>{
    const sid = l.source.id||l.source, tid = l.target.id||l.target;
    if(sid===d.id) neighborIds.add(tid);
    if(tid===d.id) neighborIds.add(sid);
  });
  nodeSel.selectAll("circle").classed("faded", n => n.id!==d.id && !neighborIds.has(n.id));
  linkSel.classed("faded", l=>{
    const sid=l.source.id||l.source, tid=l.target.id||l.target;
    return sid!==d.id && tid!==d.id;
  });
  showDetail(d, neighborIds);
}

function clearHighlight() {
  nodeSel && nodeSel.selectAll("circle").classed("faded",false);
  linkSel && linkSel.classed("faded",false);
}

function showHint() {
  document.getElementById("hint").style.display = "";
  document.getElementById("detail-panel") && (document.getElementById("detail-panel").style.display="none");
}

function showDetail(d, neighborIds) {
  const side = document.getElementById("side");
  document.getElementById("hint").style.display = "none";

  let detEl = document.getElementById("detail-panel");
  if(!detEl){ detEl=document.createElement("div"); detEl.id="detail-panel"; side.appendChild(detEl); }
  detEl.style.display="";

  // connected edges
  const outLinks = links.filter(l=>(l.source.id||l.source)===d.id);
  const inLinks = links.filter(l=>(l.target.id||l.target)===d.id);

  const chName = ["","一 專業知識","二 最佳方法","三 工作流程","四 輕重緩急","五 時間規劃","六 待辦清單","七 專注穩定","八 持續學習","貳之二 主管關係","貳之三 同事關係","貳之一 組織角度"];

  detEl.innerHTML = `
    <h2>${d.name}</h2>
    <div class="meta">章節：${chName[d.ch]||d.ch} ｜ 段落：${d.src} ｜ 連結數：${d.deg}</div>
    <div style="margin-bottom:10px;font-size:13px;line-height:1.7;color:var(--fg)">${d.desc}</div>
    ${outLinks.length?`<div style="font-size:12px;font-weight:600;margin-bottom:4px;color:var(--mu)">→ 連出（${outLinks.length}）</div>
    <ul class="conn-list">${outLinks.map(l=>{
      const tid=l.target.id||l.target;
      const tn=nodes.find(n=>n.id===tid);
      return `<li><span class="tag">${l.rel}</span><b>${tn?tn.name:tid}</b><br><span style="color:var(--mu)">${l.note}</span></li>`;
    }).join("")}</ul>`:""}
    ${inLinks.length?`<div style="font-size:12px;font-weight:600;margin:8px 0 4px;color:var(--mu)">← 連入（${inLinks.length}）</div>
    <ul class="conn-list">${inLinks.map(l=>{
      const sid=l.source.id||l.source;
      const sn=nodes.find(n=>n.id===sid);
      return `<li><span class="tag">${l.rel}</span><b>${sn?sn.name:sid}</b><br><span style="color:var(--mu)">${l.note}</span></li>`;
    }).join("")}</ul>`:""}
  `;
}

// ── 控制項
document.getElementById("chkLabels").addEventListener("change",e=>{
  showLabels=e.target.checked;
  labelSel && labelSel.style("display",showLabels?"block":"none");
});
document.getElementById("chkRel").addEventListener("change",e=>{
  showRel=e.target.checked;
  relSel && relSel.style("display",showRel?"block":"none");
});
document.getElementById("selAxis").addEventListener("change",e=>{
  activeAxis=e.target.value; selectedNode=null; clearHighlight(); showHint();
  buildGraph();
});
document.getElementById("selCh").addEventListener("change",e=>{
  activeCh=e.target.value; selectedNode=null; clearHighlight(); showHint();
  buildGraph();
});
document.getElementById("btnTheme").addEventListener("click",()=>{
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme");
  root.setAttribute("data-theme", cur==="dark"?"light":"dark");
});

// ── 初始化
document.getElementById("hint").style.display="";
buildGraph();
</script>
